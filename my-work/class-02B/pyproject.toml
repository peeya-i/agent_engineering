[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "class-02b-adk2"
version = "1.1.0"
description = "Student starter for ADK 2.x parent/sub-agent and workflow-agent labs."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-adk[gcp]==2.6.0",
  "langchain-community>=0.4.1,<0.5",
  "wikipedia>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adk_multiagent_systems*"]
