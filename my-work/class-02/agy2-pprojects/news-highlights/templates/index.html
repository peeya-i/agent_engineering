<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}} - Google News Highlights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(22, 28, 45, 0.7);
      --bg-card-hover: rgba(30, 41, 67, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(66, 133, 244, 0.3);
      --accent-blue: #4285f4;
      --accent-cyan: #24c1e0;
      --accent-purple: #a142f4;
      --accent-green: #34a853;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --glass-blur: blur(16px);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(66, 133, 244, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(161, 66, 244, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(36, 193, 224, 0.08) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Navbar Header */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .logo-icon {
      font-size: 2rem;
      background: linear-gradient(135deg, rgba(66, 133, 244, 0.2), rgba(161, 66, 244, 0.2));
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-highlight);
    }

    .logo-text h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-text h1 span {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.825rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.35rem 0.5rem 0.35rem 0.85rem;
      backdrop-filter: var(--glass-blur);
      transition: all 0.2s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(66, 133, 244, 0.3);
    }

    .search-icon {
      margin-right: 0.5rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.9rem;
      width: 180px;
    }

    .btn-search {
      background: linear-gradient(135deg, var(--accent-blue), #2563eb);
      color: white;
      border: none;
      padding: 0.4rem 0.85rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-search:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(52, 168, 83, 0.12);
      border: 1px solid rgba(52, 168, 83, 0.3);
      padding: 0.35rem 0.75rem;
      border-radius: 50px;
      font-size: 0.8rem;
      color: var(--accent-green);
      font-weight: 600;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Category Nav Pills */
    .category-bar {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.75rem;
      margin-bottom: 2rem;
      scrollbar-width: thin;
    }

    .cat-pill {
      text-decoration: none;
      color: var(--text-muted);
      background: rgba(22, 28, 45, 0.5);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1.1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .cat-pill:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(30, 41, 67, 0.6);
    }

    .cat-pill.active {
      color: white;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
    }

    /* Hero Feed Title Section */
    .feed-header {
      margin-bottom: 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .feed-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .feed-count {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* News Grid Layout */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    /* News Card Component */
    .news-card {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-glow);
    }

    .news-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(66, 133, 244, 0.15);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      font-size: 0.775rem;
    }

    .source-tag {
      background: rgba(66, 133, 244, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(66, 133, 244, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pub-date {
      color: var(--text-dim);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 1.25rem;
    }

    .card-title a {
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .card-title a:hover {
      color: var(--accent-cyan);
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .read-more-btn {
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: gap 0.2s ease, color 0.2s ease;
    }

    .read-more-btn:hover {
      color: var(--accent-cyan);
      gap: 0.5rem;
    }

    /* Footer Component */
    .footer {
      margin-top: auto;
      border-top: 1px solid var(--border-color);
      padding: 2rem 0;
      background: rgba(11, 15, 25, 0.9);
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 1.25rem;
      transition: color 0.2s ease;
    }

    .footer-links a:hover {
      color: var(--accent-blue);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-color);
      grid-column: 1 / -1;
    }

    .empty-state h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .nav-controls {
        width: 100%;
        justify-content: space-between;
      }
      .search-box input {
        width: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    {% include 'components/header.html' %}

    <nav class="category-bar">
      <a href="/" class="cat-pill {{ACTIVE_TOP}}">🔥 Top Headlines</a>
      <a href="/topic/technology" class="cat-pill {{ACTIVE_TECHNOLOGY}}">💻 Technology</a>
      <a href="/topic/world" class="cat-pill {{ACTIVE_WORLD}}">🌐 World</a>
      <a href="/topic/business" class="cat-pill {{ACTIVE_BUSINESS}}">📈 Business</a>
      <a href="/topic/science" class="cat-pill {{ACTIVE_SCIENCE}}">🔬 Science</a>
      <a href="/topic/sports" class="cat-pill {{ACTIVE_SPORTS}}">🏆 Sports</a>
      <a href="/topic/health" class="cat-pill {{ACTIVE_HEALTH}}">🏥 Health</a>
      <a href="/topic/entertainment" class="cat-pill {{ACTIVE_ENTERTAINMENT}}">🎬 Entertainment</a>
    </nav>

    <main>
      <div class="feed-header">
        <h2 class="feed-title">{{HEADER_TITLE}}</h2>
        <span class="feed-count">Showing {{ARTICLE_COUNT}} story(ies)</span>
      </div>

      <div class="news-grid">
        {{NEWS_CARDS}}
      </div>
    </main>
  </div>

  {% include 'components/footer.html' %}
</body>
</html>
